[pytest]
# INTEGRATION_WARNING: real_model tests check artifact mechanics; run the
# release-check CLI with Person A's fixtures separately before release.
testpaths = tests
pythonpath = .
markers =
    integration: uses local OpenCV, MediaPipe, and the checked-in Tasks model (no network)
    real_model: loads committed Keras weights (requires TensorFlow; not recognition accuracy)
    real_video: runs the opt-in downloaded video fixtures through MediaPipe/Keras
